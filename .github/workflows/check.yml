name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: ptmlink
          extra-packages: any::rcmdcheck, any::pkgload
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: ptmlink
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python reader tests
        run: |
          python3 -m pip install --quiet pyarrow
          python3 -m unittest discover -s tests/serve -p 'test_*.py'
      - name: R-Python parity
        run: Rscript tests/serve/test_python_parity.R || [ $? -eq 77 ]
